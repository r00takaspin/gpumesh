<div class="modal-backdrop" data-testid="modal-provider-token" onclick="if(event.target===this)this.remove()">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="pass-label">Provider token</div>
    <h3>Copy this token</h3>
    <div class="banner warn mt-12">
      Shown once — it won’t be shown again.
      <span class="key" data-testid="provider-token-value">{{.Token}}</span>
    </div>
    {{if .CoordinatorURL}}
    <div class="code mt-12" data-testid="run-command">export MESH_COORDINATOR="{{.CoordinatorHTTP}}"
export MESH_TOKEN="{{.Token}}"
gpumesh-provider</div>
    {{end}}
    <div class="actions">
      <button type="button" class="btn btn-primary" data-testid="btn-copy-provider-token" onclick="copyText(this, '{{.Token}}')">Copy token</button>
      <button type="button" class="btn" data-testid="btn-close-token-modal"
              onclick="this.closest('.modal-backdrop').remove(); htmx.trigger(document.body, 'refreshPanel')">Done</button>
    </div>
  </div>
</div>
