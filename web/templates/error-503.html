<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <title>503 — GPU Mesh</title>
</head>
<body>
  <nav class="topbar">
    <a href="/" class="logo">⚡ GPU Mesh</a>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/use">Use Models</a></li>
      <li><a href="/share">Share GPU</a></li>
      <li><a href="/models">Models</a></li>
      <li><a href="/status">Status</a></li>
    </ul>
    <div class="nav-right">
      {{if .LoggedIn}}
      <span class="nav-user mono text-accent">{{.Login}}</span>
      <a href="/logout" class="btn btn--sm nav-logout">[Logout]</a>
      {{else}}
      <a href="/auth/github?redirect=/use" class="btn-consumer btn-primary btn-sm">Sign in with GitHub</a>
      {{end}}
    </div>
  </nav>

  <main>
    <div class="empty-state">
      <strong>503 — Service unavailable</strong>
      <p>The server is temporarily overloaded.</p>
      <a href="/" class="btn-consumer btn-primary">Go home</a>
    </div>
  </main>

  <footer>
    <a href="https://github.com/r00takaspin/gpumesh">GitHub</a>
    &nbsp;·&nbsp; Powered by community &nbsp;·&nbsp; MIT
  </footer>

  <script src="/static/js/app.js"></script>
  <script src="https://unpkg.com/htmx.org@2"></script>
</body>
</html>
