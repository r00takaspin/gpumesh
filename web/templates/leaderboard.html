<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GPU Mesh — Free peer-to-peer LLM inference network. Use any OpenAI-compatible tool with community GPUs. No credit card.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <title>Leaderboard — GPU Mesh</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="topbar">
    <span class="logo">⚡ GPU Mesh</span>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/dashboard">Dashboard</a></li>
      <li><a href="/models">Models</a></li>
      <li><a href="/leaderboard" class="active">Leaderboard</a></li>
      <li><a href="/status">Status</a></li>
    </ul>
    <div class="nav-right">
      {{if .LoggedIn}}
      <span class="nav-user mono text-accent">{{.Login}}</span>
      <a href="/logout" class="btn btn--sm nav-logout">[Logout]</a>
      {{else}}
      <a href="/login" class="btn btn--sm nav-login">[Login with GitHub]</a>
      {{end}}
    </div>
  </nav>

  <main>
    <div class="prompt">cat /leaderboard --period=weekly</div>


    <!-- Period Tabs -->
    <div class="tabs">
      <button class="tab-btn active"
        hx-get="/leaderboard/page?period=weekly"
        hx-target="#leaderboard-content"
        hx-swap="outerHTML"
        onclick="document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));this.classList.add('active')">WEEKLY</button>
      <button class="tab-btn"
        hx-get="/leaderboard/page?period=monthly"
        hx-target="#leaderboard-content"
        hx-swap="outerHTML"
        onclick="document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));this.classList.add('active')">MONTHLY</button>
      <button class="tab-btn"
        hx-get="/leaderboard/page?period=all"
        hx-target="#leaderboard-content"
        hx-swap="outerHTML"
        onclick="document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));this.classList.add('active')">ALL-TIME</button>
    </div>

    <div id="leaderboard-content" hx-get="/leaderboard/page?period=all" hx-trigger="load, every 120s" hx-swap="outerHTML">
      <div class="card"><p class="text-dim text-center">Loading leaderboard...</p></div>
    </div>

  </main>

  <footer>
    <div class="footer-row">
      <span><a href="https://github.com/r00takaspin/gpumesh">GitHub</a></span>
      <span>▶ {{.DonorsOnline}} donors online</span>
      <span>MIT License</span>
    </div>
  </footer>

  <script src="/static/js/app.js"></script>
  <script src="https://unpkg.com/htmx.org@2"></script>
</body>
</html>
