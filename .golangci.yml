version: "2"

linters:
  enable:
    - errcheck
    - staticcheck
    - unused

  exclusions:
    rules:
      # fmt.Fprint* to stdout/stderr in wizards/CLI — intentional, no recovery path
      - path: internal/provider/wizard\.go
        linters: [errcheck]
        text: "fmt\\.Fprint"
      # defer resp.Body.Close() — common Go idiom, no recovery path
      - path: internal/provider/
        linters: [errcheck]
        text: "Body\\.Close"
      # defer resp.Body.Close() — same
      - path: internal/provider/
        linters: [errcheck]
        text: "ollamaResp\\.Body\\.Close"
      # WebSocket writes in provider — best-effort
      - path: internal/provider/
        linters: [errcheck]
        text: "conn\\.(WriteJSON|SetReadDeadline)"
      # WebSocket close in provider — cleanup path
      - path: internal/provider/agent\.go
        linters: [errcheck]
        text: "a\\.conn\\.Close"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
