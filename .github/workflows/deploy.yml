name: Deploy to Cloud Run

on:
  push:
    branches: [main]

env:
  SERVICE: gpumesh
  REGION: europe-west1

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ secrets.GCP_SA_KEY != '' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push
        run: |
          gcloud builds submit \
            --tag "gcr.io/${{ vars.GCP_PROJECT_ID }}/$SERVICE:${{ github.sha }}"

      - name: Deploy
        run: |
          gcloud run deploy $SERVICE \
            --image "gcr.io/${{ vars.GCP_PROJECT_ID }}/$SERVICE:${{ github.sha }}" \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 256Mi \
            --cpu 1
