builds:
  - id: provider
    main: ./cmd/provider
    binary: gpumesh-provider
    goos: [linux, darwin]
    goarch: [amd64, arm64]
  - id: coordinator
    main: ./cmd/coordinator
    binary: gpumesh-coordinator
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
